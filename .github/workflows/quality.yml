name: Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-quality-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-quality-composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer quality
      - run: python -m json.tool component.json
      - run: python -m json.tool component.lock
      - run: test -f engineering/reviews/WP-000-Implementation-Report.md
      - run: test -z "$(git status --porcelain)"
